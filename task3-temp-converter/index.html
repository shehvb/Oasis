<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container">
    <div class="converter-card">
      <header class="card-header">
        <span class="icon">🌡️</span>
        <h1>Temperature Converter</h1>
        <p>Convert values seamlessly between Celsius, Fahrenheit, and Kelvin.</p>
      </header>

      <form id="converter-form" novalidate>
        <div class="input-group">
          <label for="temp-input">Degrees</label>
          <input 
            type="number" 
            id="temp-input" 
            step="any" 
            placeholder="e.g. 25" 
            required 
            autocomplete="off"
          >
        </div>

        <div class="input-group">
          <label for="unit-select">Input Unit</label>
          <select id="unit-select">
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="kelvin">Kelvin (K)</option>
          </select>
        </div>

        <button type="submit" id="convert-btn" class="btn-convert">Convert</button>
      </form>

      <div id="error-message" class="error-box hidden" role="alert"></div>

      <div id="results-area" class="results-container">
        <h2>Converted Results</h2>
        <div class="results-grid">
          <div class="result-card" id="res-celsius">
            <span class="unit-title">Celsius</span>
            <span class="unit-val" id="val-celsius">-- °C</span>
          </div>
          <div class="result-card" id="res-fahrenheit">
            <span class="unit-title">Fahrenheit</span>
            <span class="unit-val" id="val-fahrenheit">-- °F</span>
          </div>
          <div class="result-card" id="res-kelvin">
            <span class="unit-title">Kelvin</span>
            <span class="unit-val" id="val-kelvin">-- K</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
